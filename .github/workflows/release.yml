name: Automated Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Standalone Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "CleanYourTV-Manager" `
            --icon "assets/icon.ico" `
            --add-data "assets;assets" `
            main.py

      - name: Package Zip Archive
        run: |
          Compress-Archive -Path "dist/CleanYourTV-Manager.exe" -DestinationPath "dist/CleanYourTV-Manager-${{ github.ref_name }}-windows-x64.zip" -Force

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CleanYourTV Desktop Manager ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/CleanYourTV-Manager.exe
            dist/CleanYourTV-Manager-${{ github.ref_name }}-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


[tool.pyright]
pythonVersion = "3.11"
venvPath = "c:\\Users\\hp\\Desktop\\Projets\\cleanyourtv\\tools"
venv = "venv"
include = ["src", "main.py"]
exclude = ["build", "dist", "**/__pycache__"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
useLibraryCodeForTypes = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line length handled per file

[tool.ruff.lint.per-file-ignores]
"src/ui/**" = ["E501"]  # UI builders can have longer widget lines

